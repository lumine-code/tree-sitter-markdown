[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-markdown"
description = "Parse Markdown with block and inline Tree-sitter grammars."
version = "1.0.0"
keywords = ["incremental", "parsing", "tree-sitter", "markdown"]
classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]
authors = [
  {name = "lumine-code"}
]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]
readme = "README.md"

[project.urls]
Homepage = "https://github.com/lumine-code/tree-sitter-markdown"

[project.optional-dependencies]
core = ["tree-sitter>=0.25.2,<0.27,!=0.26.0"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
