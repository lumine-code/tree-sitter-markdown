name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:generated
      - run: npm run build:native
      - run: npm run build:wasm
      - run: npm test
      - run: npm pack --dry-run
      - name: Generate all optional extensions
        run: npm run build:all
      - name: Test all optional extensions
        run: npm run test:corpus
      - name: Restore and verify the default dialect
        run: npm run check:generated

  bindings:
    name: Rust and Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test Rust bindings and extracted crate
        run: |
          cargo +stable test --all-features
          cargo +stable package --allow-dirty
      - name: Build and test Python bindings
        run: |
          python -m pip install '.[core]'
          python -m unittest discover -s bindings/python/tests -v
