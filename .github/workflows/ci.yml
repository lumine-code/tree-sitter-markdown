name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      macos_runner:
        description: macOS runner for this manual validation
        type: choice
        required: true
        default: macos-latest
        options:
          - macos-latest
          - macos-15-intel
      source_ref:
        description: Source commit or ref to test (defaults to the triggering commit)
        type: string
        required: false
  workflow_call:
    inputs:
      ref:
        description: Source commit or ref to test (defaults to the triggering commit)
        type: string
        required: false
      macos_runner:
        description: macOS hosted runner (macos-latest or macos-15-intel)
        type: string
        required: false
        default: macos-latest

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node 24 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Only an explicit manual/reusable override selects Intel. Pushes and
        # pull requests keep the default macos-latest architecture.
        os:
          - ubuntu-latest
          - ${{ inputs.macos_runner == 'macos-15-intel' && 'macos-15-intel' || 'macos-latest' }}
          - windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.ref || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:generated
      - run: npm run build:native
      - run: npm run build:wasm
      - run: npm test
      - run: npm pack --dry-run
      - name: Generate all optional extensions
        run: npm run build:all
      - name: Test all optional extensions
        run: npm run test:corpus
      - name: Restore and verify the default dialect
        run: npm run check:generated

  bindings:
    name: Rust and Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.ref || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test Rust bindings and extracted crate
        run: |
          cargo +stable test --all-features
          cargo +stable package --allow-dirty
      - name: Build and test Python source distribution
        shell: bash
        run: |
          python -m pip install build
          python -m build
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          import tarfile
          import zipfile

          sdists = list(Path("dist").glob("*.tar.gz"))
          wheels = list(Path("dist").glob("*.whl"))
          assert len(sdists) == len(wheels) == 1, (sdists, wheels)
          with tarfile.open(sdists[0]) as source, zipfile.ZipFile(wheels[0]) as wheel:
              for filename in ("LICENSE", "THIRD_PARTY_NOTICES"):
                  expected = Path(filename).read_bytes()
                  source_files = [entry for entry in source.getmembers()
                                  if entry.isfile() and entry.name.split("/", 1)[-1] == filename]
                  wheel_files = [entry for entry in wheel.namelist()
                                 if entry.endswith(f".dist-info/licenses/{filename}")]
                  assert len(source_files) == len(wheel_files) == 1, filename
                  assert source.extractfile(source_files[0]).read() == expected, filename
                  assert wheel.read(wheel_files[0]) == expected, filename
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"{wheels[0].resolve()}[core]"])
          PY
          python -m unittest discover -s bindings/python/tests -v
          python -m pip check

  swift:
    name: Swift bindings
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.ref || github.sha }}
      - name: Inspect Swift toolchain
        run: swift --version
      - name: Resolve committed Swift dependencies
        run: |
          swift package resolve
          git diff --exit-code -- Package.resolved
      - name: Test Swift bindings
        run: swift test
      - name: Preserve resolved Swift dependencies
        uses: actions/upload-artifact@v7
        with:
          name: markdown-swift-package-resolved
          path: Package.resolved
          if-no-files-found: error
