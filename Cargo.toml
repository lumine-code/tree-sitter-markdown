[package]
name = "tree-sitter-md"
description = "Parse Markdown with block and inline Tree-sitter grammars."
version = "1.0.0"
authors = ["lumine-code"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "markdown"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/lumine-code/tree-sitter-markdown"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "/LICENSE",
  "/THIRD_PARTY_NOTICES",
  "/README.md",
  "/bindings/rust/*",
  "/tree-sitter-markdown/src/*",
  "/tree-sitter-markdown-inline/src/*",
  "/tree-sitter-markdown/grammar.js",
  "/tree-sitter-markdown-inline/grammar.js",
  "/tree-sitter-markdown/queries/*",
  "/tree-sitter-markdown-inline/queries/*",
  "/common/common.js",
  "/common/html_entities.json",
]

[features]
parser = ["dep:tree-sitter"]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"
tree-sitter = { version = "0.27", optional = true }

[dev-dependencies]
tree-sitter = "0.27.1"

[build-dependencies]
cc = "1.2"

[[bin]]
name = "benchmark"
path = "bindings/rust/benchmark.rs"
required-features = ["parser"]

[profile.release]
debug = true

[package.metadata.docs.rs]
features = ["parser"]
rustdoc-args = ["--cfg", "docsrs"]
